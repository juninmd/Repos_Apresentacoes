version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns:
      - '*'
  cooldown:
    default-days: 7
- package-ecosystem: npm
  directory: /apresentacao-pwa-api
  schedule:
    interval: weekly
  groups:
    npm:
      patterns:
      - '*'
  cooldown:
    default-days: 7
